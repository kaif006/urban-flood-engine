version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: flood_sim_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123 
      POSTGRES_DB: flood_sim_karachi
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data:
